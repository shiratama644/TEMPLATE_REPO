# pre-commit フック（分野を問わない汎用セット）
#
# 導入: pipx install pre-commit（または pip install pre-commit）→ make setup
# 全ファイルに実行: make check（CI と同じ入口）
#
# 前提: Biome のフックは Node.js を使う（pre-commit が必要な Node を用意する）。
#       Node を使わないプロジェクトでは、SKIP=biome git commit で一時的に外せる。
#       gitleaks は未導入ならスキップされる（CI の secrets ジョブで必ず検査する）。

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # 基本の衛生チェック（テキスト・設定ファイル・秘密鍵など）
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        # 上流由来の skill（.agent/skills/）とライセンス全文は、上流の文面をそのまま保つ
        exclude: ^\.agent/skills/|(^|/)LICENSE(\.txt)?$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^\.agent/skills/
      - id: trailing-whitespace
        exclude: ^\.agent/skills/|\.md$|(^|/)LICENSE(\.txt)?$

  # 綴りの誤り（英語の文書・コード・コメント）
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # コミットメッセージを Conventional Commits 形式に揃える（AGENTS.md §4.2）
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # プロジェクト内のローカルフック
  - repo: local
    hooks:
      # JSON / JS / TS / CSS の整形と lint（設定は biome.json）
      - id: biome
        name: biome（整形・lint）
        entry: biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: node
        additional_dependencies: ["@biomejs/biome@2.5.15"]
        files: \.(json|jsonc|js|jsx|mjs|cjs|ts|tsx|css)$
        exclude: ^\.agent/(skills|workflows)/

      # 指示ファイルの予算と品質（agents-md-lint。Codex の 32 KiB 上限・行数・参照パスの実在など）
      # 入れ子の AGENTS.md（ディレクトリ単位）にも対応する。版は additional_dependencies で固定する。
      #
      # ⚠️ 上流 1.0.1 の bin は symlink 経由で起動すると何も出力せず exit 0 になる。
      #    cli.js のエントリポイント判定が pathToFileURL(process.argv[1]).href と
      #    import.meta.url を比較するが、Node は import.meta.url を realpath にする一方
      #    argv[1] は呼び出しに使った symlink のままなので一致せず、run() が実行されない。
      #    npm bin は必ず symlink なので npx 経由でも同じ（＝黙って成功する no-op）。
      #    そのため readlink -f で実体を解決し node で直接起動する。
      #    上流が修正したら entry を `agents-md-lint --root .` に戻すこと。
      - id: agents-md-lint
        name: AGENTS.md の予算と品質
        entry: sh -c 'exec node "$(readlink -f "$(command -v agents-md-lint)")" --root . "$@"' --
        language: node
        additional_dependencies: ["agents-md-lint@1.0.1"]
        files: (^|/)AGENTS\.md$

      # Markdown の内部リンク切れを検出（scripts/check_doc_links.py）
      - id: doc-links
        name: 内部リンクの実在
        entry: python3 scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: \.md$

      # Mermaid 図の宣言の不備を検出（scripts/check_mermaid.py）
      - id: mermaid-syntax
        name: Mermaid 図の宣言
        entry: python3 scripts/check_mermaid.py
        language: system
        pass_filenames: false
        files: \.md$

      # 秘密情報の混入（gitleaks が入っている場合のみ。無ければスキップし、CI で必ず検査する）
      - id: gitleaks
        name: gitleaks（秘密情報の検出）
        entry: sh -c 'command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks 未導入のためスキップ（CI で検査します）"; exit 0; }; exec gitleaks protect --staged --redact --config .gitleaks.toml'
        language: system
        pass_filenames: false
        always_run: true
