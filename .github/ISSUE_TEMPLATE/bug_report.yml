name: 🐛 Bug Report
description: バグを報告する
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます！以下の情報をできるだけ詳しく記入してください。

  - type: input
    id: version
    attributes:
      label: バージョン
      description: 使用しているテンプレートのバージョン / コミットSHA
      placeholder: e.g. v0.1.0 / 9159981
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影響範囲
      options:
        - execute.ts / check.ts
        - CI / GitHub Actions
        - pnpm / dependencies
        - husky / commitlint / lint-staged
        - cspell / knip / biome
        - Docker / devcontainer
        - その他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: 何が起きたか、期待される動作は何か
      placeholder: |
        ## 現象
        ...

        ## 期待される動作
        ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグを再現する最小手順
      placeholder: |
        1. pnpm install
        2. pnpm ...
        3. ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ / スクリーンショット
      description: 関連するログやスクリーンショットがあれば貼り付け
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: 環境情報
      description: OS, Node, pnpm バージョンなど
      placeholder: |
        - OS: macOS 15 / Ubuntu 22.04 / Windows 11
        - Node: 24.x
        - pnpm: 12.6.0
        - ...
      render: markdown

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueを検索し、重複がないことを確認した
          required: true
        - label: 最新のmainブランチで再現することを確認した
          required: false
        - label: セキュリティ関連のバグの場合は SECURITY.md に従い非公開で報告した
          required: false
