# Full lockfile scan; PR dependency-review remains the separate delta gate.
name: OSV Scanner
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: bun.lock known vulnerabilities
    permissions:
      contents: read
      actions: read # reusable workflow uploads the scan artifact
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=bun.lock
      upload-sarif: false
      fail-on-vuln: true
