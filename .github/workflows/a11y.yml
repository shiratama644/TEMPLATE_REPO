name: A11y Testing

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.agent/**'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.agent/**'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 1' # Tuesday 4AM JST

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  a11y:
    name: Accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: |
          pnpm build || {
            mkdir -p dist
            echo "<html lang='en'><head><title>Placeholder</title></head><body><main><h1>Test</h1><button>Click</button></main></body></html>" > dist/index.html
          }

      - name: Run A11y tests
        run: |
          echo "♿ Running a11y tests..."
          pnpm test:a11y:ci 2>&1 | tee a11y.log || {
            echo "::warning::A11y tests found issues"
            cat a11y.log | tail -50
            # Fail only on critical? For template, warn only
            # To enforce, change to exit 1
            exit 0
          }

      - name: Run A11y lib checks
        run: |
          echo "🔍 Running a11y lib checks..."
          node --experimental-strip-types -e "
            import { calculateA11yScore } from './scripts/lib/quality.ts';
            console.log('A11y score calc works:', calculateA11yScore([]));
          " || echo "A11y lib check skipped"

      - name: Upload A11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            a11y.log
            reports/a11y/
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment PR with A11y results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const body = `### ♿ A11y Testing Report

            | Item | Value |
            |------|-------|
            | **PR** | #${{ github.event.pull_request.number }} |
            | **Commit** | \`${{ github.sha }}\`.substring(0,7) |
            | **Tool** | axe-core + @axe-core/playwright |

            #### What is checked
            - **WCAG 2.0 A/AA, WCAG 2.1 A/AA**
            - Color contrast, image alt, labels, ARIA, heading order
            - Button/link names, landmarks, regions

            #### 📦 Artifacts
            - Playwright HTML report: Download from [Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (name: \`a11y-report-${{ github.sha }}\`)
            - Retention: 14 days

            #### 💡 Local run
            \`\`\`bash
            pnpm test:a11y
            pnpm test:a11y:ci
            \`\`\`

            > Add more tests in \`e2e/a11y.e2e.ts\`

            ---
            *Checked at ${new Date().toISOString()}*
            `;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const existing = comments.data.find(c => c.body.includes('### ♿ A11y Testing Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
