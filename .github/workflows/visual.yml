name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.agent/**'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.agent/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: |
          pnpm build || {
            mkdir -p dist
            echo "<html><body><h1>Placeholder</h1></body></html>" > dist/index.html
          }

      - name: Run visual tests
        run: |
          echo "👁️ Running visual regression tests..."
          pnpm test:visual:ci 2>&1 | tee visual.log || {
            echo "::warning::Visual tests found diffs"
            cat visual.log | tail -100
            # For template, warn only - visual diffs expected on first run
            # To enforce, change to exit 1
            exit 0
          }

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            e2e/**/*.png
            e2e/**/*.snap.png
            visual.log
            reports/visual/
            **/*-snapshots/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-pr-${{ github.event.pull_request.number || github.sha }}
          path: |
            e2e/
            **/*.png
            !node_modules/
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with visual results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const body = `### 👁️ Visual Regression Report

            | Item | Value |
            |------|-------|
            | **PR** | #${{ github.event.pull_request.number }} |
            | **Commit** | \`${{ github.sha }}\`.substring(0,7) |
            | **Tool** | Playwright toHaveScreenshot |

            #### What is checked
            - Homepage, card components, responsive (mobile/desktop)
            - Pixel diff with threshold 0.2, max 100 pixels
            - Animations disabled, caret hidden

            #### 📦 Artifacts
            - Snapshots & diffs: Download from [Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (name: \`visual-report-${{ github.sha }}\`)
            - Update snapshots: \`pnpm test:visual:update\`
            - Retention: 14 days

            #### 💡 Local run
            \`\`\`bash
            pnpm test:visual
            pnpm test:visual:update  # Update baselines
            \`\`\`

            > Snapshots in \`e2e/*.snapshots/\` or \`test-results/\`

            ---
            *Checked at ${new Date().toISOString()}*
            `;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const existing = comments.data.find(c => c.body.includes('### 👁️ Visual Regression Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
