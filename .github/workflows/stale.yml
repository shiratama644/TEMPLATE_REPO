name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 2 * * 1' # 毎週月曜 2:00 UTC (JST 11:00)
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Issue設定
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: |
            このIssueは60日間活動がないため stale ラベルが付与されました。
            まだ有効な場合はコメントで教えてください。14日以内に活動がなければ自動でクローズされます。
            このIssueがまだ必要であれば `stale` ラベルを外してください。
          close-issue-message: |
            14日間活動がなかったため、このIssueを自動でクローズしました。
            まだ必要な場合は再オープンしてください。
          # PR設定
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            このPRは30日間活動がないため stale ラベルが付与されました。
            まだマージしたい場合はコメントやpushで更新してください。7日以内に活動がなければ自動でクローズされます。
          close-pr-message: |
            7日間活動がなかったため、このPRを自動でクローズしました。
            まだ必要な場合は再オープンしてください。
          # 除外ラベル
          exempt-issue-labels: 'pinned,security,enhancement'
          exempt-pr-labels: 'pinned,security,dependencies'
          # 週末はカウントしない
          days-before-stale: -1
