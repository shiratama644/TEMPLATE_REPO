# 依存関係の変更を PR でレビューする（ecosystem を問わない）。
# このジョブは GitHub の Dependency graph が有効なときだけ動く。
# 未有効だと "Dependency review is not supported on this repository" で失敗する。
# 有効化: リポジトリ Settings → Code security and analysis → Dependency graph。
name: Dependency Review

on:
  pull_request:
  merge_group: # merge queue でも必須チェックを揃える（job は pull_request だけで走る）

permissions:
  contents: read

concurrency:
  # 同じ PR の連続 push は前の実行を打ち切る
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: 依存関係の差分レビュー
    # action は PR の base/head を読むため、merge_group では走らない（skip は必須チェックとして成功扱い）。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
