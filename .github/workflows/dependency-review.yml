# 依存関係の変更を PR でレビューする（ecosystem を問わない）。
# このジョブは GitHub の Dependency graph が有効なときだけ動く。
# 未有効だと "Dependency review is not supported on this repository" で失敗する。
# 有効化: リポジトリ Settings → Code security and analysis → Dependency graph。
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  # 同じ PR の連続 push は前の実行を打ち切る
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: 依存関係の差分レビュー
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
