# 依存関係の変更を PR でレビューする（ecosystem を問わない）。
# このジョブは GitHub の Dependency graph が有効なときだけ動く。
# 未有効だと "Dependency review is not supported on this repository" で失敗する。
# 有効化: リポジトリ Settings → Code security and analysis → Dependency graph。
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: 依存関係の差分レビュー
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
