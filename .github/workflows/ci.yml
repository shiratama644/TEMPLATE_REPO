name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR は番号ごとに 1 実行（push と PR で同じ commit が競合しない）。main への push は打ち切らない。
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: bun run check（全ゲート）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22" # npm bin の Node 実行経路を回帰テストする
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Require native build toolchains (no skipped Go/Rust tests)
        run: |
          go version
          cargo --version
          python3 --version
          script --version
          stty --version
      - run: bun run check
        env:
          CI_REQUIRE_NATIVE: "1"
      - run: bun run knip
  secrets:
    name: 秘密情報の検出（gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  workflow-audit:
    name: actionlint / zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned actionlint and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf /tmp/actionlint.tar.gz -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check workflows and negative fixture
        shell: bash
        run: |
          set -euo pipefail
          actionlint -version
          actionlint -color=false .github/workflows/*.yml
          if actionlint -color=false tests/fixtures/invalid-workflow.yml > /tmp/actionlint-negative.log 2>&1; then
            echo '::error::actionlint accepted the invalid workflow'
            exit 1
          fi
          grep -q 'unexpected key' /tmp/actionlint-negative.log || { cat /tmp/actionlint-negative.log; exit 1; }
      # zizmor-action はハッシュ検証済みの wheel を PyPI から取り、版は action の版に同梱される lock で決まる
      # （Dependabot が action の SHA を更新する）。GHAS (SARIF) モードは findings で失敗しないので off にする。
      - name: Audit workflows (zizmor, offline, fails on findings)
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          inputs: .
          online-audits: false
          strict-collection: true
          min-severity: medium
          advanced-security: false
          annotations: true
          color: false
      - name: zizmor must reject the unsafe fixture (this step is expected to fail)
        id: zizmor-negative
        continue-on-error: true
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          inputs: tests/fixtures/unsafe-workflow.yml
          online-audits: false
          min-severity: medium
          advanced-security: false
          annotations: false
          color: false
          fail-on-no-inputs: false
      - name: Assert the unsafe fixture was rejected
        shell: bash
        env:
          OUTCOME: ${{ steps.zizmor-negative.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo '::error::zizmor accepted the unsafe workflow (outcome: '"$OUTCOME"')'
            exit 1
          fi
          echo 'zizmor rejected the unsafe workflow as expected'
  # PR では base との差分で「新規」の脆弱性だけを失敗させる。全体スキャンは osv-scan.yml（main / 毎週）。
  osv-pr:
    name: OSV bun.lock 新規脆弱性（PR 差分）
    permissions:
      contents: read
      actions: read # reusable workflow uploads the scan artifact
      # reusable workflow の job が宣言するため呼び出し側も必要（宣言が足りないと起動時に invalid workflow）。
      # upload-sarif: false なので実際には使われない。
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=bun.lock
      upload-sarif: false
      fail-on-vuln: true
