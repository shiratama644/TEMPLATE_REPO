# タグ付きリリースの前に Bun ベースの全検証を実行する。検証（読み取り専用）と Release 作成
# （contents: write）を別ジョブに分け、書き込み権限はリリースのジョブだけに渡す。
name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
jobs:
  verify:
    name: bun run check + knip（CI と同じ条件）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24" # npm bin の Node 実行経路を回帰テストする
          package-manager-cache: false # リリースではキャッシュに依存しない（setup-bun の no-cache と同じ）
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Require native build toolchains (no skipped Go/Rust tests)
        run: |
          go version
          cargo --version
          python3 --version
          script --version
          stty --version
      - run: bun run check
        env:
          CI_REQUIRE_NATIVE: "1"
      - run: bun run knip
  release:
    name: GitHub Release を作成
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create に必要。このジョブだけに限定する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: GitHub Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        # タグにハイフンが入る版（v1.2.3-rc.1 など）は pre-release として作成する。
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${args[@]+"${args[@]}"}
